<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slop Space Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Search Bar -->
        <header class="header">
            <div class="search-container">
                <button class="back-button" onclick="window.location.href='index.html'">Back to Slop Space</button>
                <input type="text" id="searchInput" class="search-input" placeholder="Search products...">
                <button class="search-button" onclick="searchProducts()">Search</button>
            </div>
        </header>

        <!-- Products Display Area -->
        <main class="main-content">
            <div id="productsContainer" class="products-grid">
                <!-- Products will be dynamically generated by JavaScript -->
            </div>

            <!-- Pagination Controls -->
            <div class="pagination">
                <button id="prevPage" class="page-button" onclick="changePage(-1)">Previous</button>
                <span id="pageInfo" class="page-info">Page 1 of 1</span>
                <button id="nextPage" class="page-button" onclick="changePage(1)">Next</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
